# Local "model hub": serves synthetic model weights at a throttled per-connection rate,
# so model-download cold starts are reproducible without internet access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-hub-nginx
  namespace: kubesage-infra
data:
  default.conf: |
    server {
        listen 80;
        root /data;
        location / {
            limit_rate 10m;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-hub
  namespace: kubesage-infra
  labels:
    app.kubernetes.io/name: model-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-hub
    spec:
      nodeSelector:
        kubesage.io/pool: infra
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: generate-weights
          image: busybox:1.37
          command:
            - sh
            - -c
            - head -c 262144000 /dev/urandom > /data/weights.bin && ls -l /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: model-hub-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: model-hub
  namespace: kubesage-infra
spec:
  selector:
    app.kubernetes.io/name: model-hub
  ports:
    - port: 80
      targetPort: 80

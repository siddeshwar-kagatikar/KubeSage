# KubeSage's identity. The backend impersonates this ServiceAccount for every Kubernetes call
# (KUBESAGE_KUBE_IMPERSONATE), so the API server enforces: read-only cluster-wide (never Secrets),
# pod logs only in the demo and sandbox namespaces, and writes only in kubesage-sandbox.
apiVersion: v1
kind: Namespace
metadata:
  name: kubesage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesage
  namespace: kubesage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesage-reader
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes, namespaces, configmaps, services, endpoints, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesage-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesage-reader
subjects:
  - kind: ServiceAccount
    name: kubesage
    namespace: kubesage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesage-logs
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesage-logs
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesage-logs
subjects:
  - kind: ServiceAccount
    name: kubesage
    namespace: kubesage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesage-sandbox-writer
  namespace: kubesage-sandbox
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesage-sandbox-writer
  namespace: kubesage-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesage-sandbox-writer
subjects:
  - kind: ServiceAccount
    name: kubesage
    namespace: kubesage-system

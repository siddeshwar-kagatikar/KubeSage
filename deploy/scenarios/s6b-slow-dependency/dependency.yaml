# A dependency that answers HTTP only ~40 s after it starts. Recreate strategy: a restart takes it fully down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-dependency
  namespace: kubesage-infra
  labels:
    app.kubernetes.io/name: slow-dependency
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slow-dependency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slow-dependency
    spec:
      nodeSelector:
        kubesage.io/pool: infra
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: httpd
          image: busybox:1.37
          command: ["sh", "-c", "sleep 40; mkdir -p /www; echo ok > /www/index.html; exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slow-dependency
  namespace: kubesage-infra
spec:
  selector:
    app.kubernetes.io/name: slow-dependency
  ports:
    - port: 80
      targetPort: 8080

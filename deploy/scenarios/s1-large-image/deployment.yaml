# S1 — Large image: bloated AI image (~1.5 GB uncompressed, unused torch) pulled at ~20 MB/s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: large-image-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: large-image-svc
    kubesage.io/scenario: s1-large-image
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: large-image-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: large-image-svc
        kubesage.io/scenario: s1-large-image
    spec:
      nodeSelector:
        kubesage.io/pool: workload
      containers:
        - name: app
          image: localhost:5001/demo-ai-service:fat
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_SERVICE_NAME
              value: large-image-svc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.kubesage-infra.svc.cluster.local:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

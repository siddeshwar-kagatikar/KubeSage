# S3 — Slow model-weight loading: ~250 MB of weights downloaded from the throttled model hub (~10 MB/s) on every start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-weights-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: model-weights-svc
    kubesage.io/scenario: s3-model-weights
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: model-weights-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-weights-svc
        kubesage.io/scenario: s3-model-weights
    spec:
      nodeSelector:
        kubesage.io/pool: workload
      containers:
        - name: app
          image: localhost:5001/demo-ai-service:slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_SERVICE_NAME
              value: model-weights-svc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.kubesage-infra.svc.cluster.local:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)
            - name: MODEL_URL
              value: http://model-hub.kubesage-infra.svc.cluster.local/weights.bin
            - name: MODEL_DIR
              value: /work/model
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi

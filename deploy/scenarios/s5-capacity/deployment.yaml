# S5 — Insufficient capacity: the app requests 3 CPUs while a "hog" holds 14 of the workload node's 16.
# run-scenario.ps1 releases the hog after 40 s (standing in for capacity freeing up or a node being added),
# so the pod waits in Pending with FailedScheduling events, then starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: capacity-svc
    kubesage.io/scenario: s5-capacity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-svc
        kubesage.io/scenario: s5-capacity
    spec:
      nodeSelector:
        kubesage.io/pool: workload
      containers:
        - name: app
          image: localhost:5001/demo-ai-service:slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_SERVICE_NAME
              value: capacity-svc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.kubesage-infra.svc.cluster.local:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
          resources:
            requests:
              cpu: "3"
              memory: 128Mi
            limits:
              cpu: "3"
              memory: 512Mi

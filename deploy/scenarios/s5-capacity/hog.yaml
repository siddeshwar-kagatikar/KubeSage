# Holds CPU requests on the workload node so capacity-svc cannot schedule. Not monitored (kubesage-infra).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-hog
  namespace: kubesage-infra
  labels:
    app.kubernetes.io/name: capacity-hog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-hog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-hog
    spec:
      nodeSelector:
        kubesage.io/pool: workload
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "14"
              memory: 8Mi
            limits:
              memory: 16Mi
